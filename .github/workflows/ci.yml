name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  # ── Build & Test ────────────────────────────────────────────────
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.js

      - name: Run smoke tests
        run: node test.js

      - name: Run full test suite
        run: node tests/test.js

      - name: Check output sizes
        run: |
          echo "Uncompressed: $(wc -c < dist/spamwarden.js) bytes"
          echo "Minified:     $(wc -c < dist/spamwarden.min.js) bytes"
          echo "Gzipped:      $(gzip -c dist/spamwarden.min.js | wc -c) bytes"

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spam-warden-dist
          path: dist/

  # ── Release ──────────────────────────────────────────────────────
  release:
    name: Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build
        run: node build.js

      # ── Inject Version Header ────────────────────────────────────
      - name: Inject Version into Minified JS
        run: |
          # Creates a header with the GitHub tag (e.g., v1.0.0)
          HEADER="/*! SpamWarden ${{ github.ref_name }} | (c) RedSocs */"
          
          # Prepend the header to the minified file
          echo "$HEADER" > header.txt
          cat header.txt dist/spamwarden.min.js > temp.js
          mv temp.js dist/spamwarden.min.js

      - name: Package dist
        run: |
          tar czf spam-warden-dist.tar.gz -C dist .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: spam-warden-dist.tar.gz
          generate_release_notes: true

      # ── Cloudflare R2 Upload ─────────────────────────────────────
      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          # 1. Upload a version-locked copy (e.g., /js/v1.0.0/spam-warden.min.js)
          aws s3 cp dist/spamwarden.min.js s3://${{ secrets.R2_BUCKET_NAME }}/js/${{ github.ref_name }}/spam-warden.min.js \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com

          # 2. Overwrite the "latest" copy (/js/spam-warden.min.js)
          aws s3 cp dist/spamwarden.min.js s3://${{ secrets.R2_BUCKET_NAME }}/js/spam-warden.min.js \
            --endpoint-url https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com







            
